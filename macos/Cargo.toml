# Open Tether for macOS: a native Rust port of the iOS app's TetherCore engine
# with a Tauri 2 front end. See README.md.
[workspace]
resolver = "2"
members = [
    "crates/tether-types",
    "crates/tether-ptp",
    "crates/tether-net",
    "crates/tether-library",
    "crates/tether-session",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
tether-types = { path = "crates/tether-types" }
tether-ptp = { path = "crates/tether-ptp" }
tether-net = { path = "crates/tether-net" }
tether-library = { path = "crates/tether-library" }
tether-session = { path = "crates/tether-session" }

tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
bytes = "1"
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bitflags = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio-tungstenite = "0.29"
mdns-sd = "0.13"
socket2 = "0.5"
if-addrs = "0.13"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
kamadak-exif = "0.6"
quick-xml = "0.37"
tokio-rustls = "0.26"
rustls-native-certs = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3"
# macOS ImageCaptureCore (tether-ptp USB transport)
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false }
objc2-image-capture-core = { version = "0.3", default-features = false }
objc2-core-graphics = { version = "0.3", default-features = false }
block2 = "0.6"
dispatch2 = "0.3"
# tether-library: Core Image RAW development on macOS, base64 for Swift `Data` JSON
objc2-core-image = { version = "0.3", default-features = false }
objc2-core-foundation = { version = "0.3", default-features = false }
base64 = "0.22"
# tether-session: FTP passwords in the Keychain, exports to Photos
security-framework = "3"
objc2-photos = { version = "0.3", default-features = false }
