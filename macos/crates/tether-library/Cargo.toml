[package]
name = "tether-library"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
tether-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
uuid.workspace = true
rusqlite.workspace = true
image.workspace = true
quick-xml.workspace = true
tokio.workspace = true
async-trait.workspace = true
tempfile.workspace = true
base64.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["std", "NSData", "NSDictionary", "NSString", "NSObject", "NSValue"] }
objc2-core-foundation = { workspace = true, features = ["std", "CFCGTypes", "CFString"] }
objc2-core-graphics = { workspace = true, features = ["std", "CGColorSpace"] }
objc2-core-image = { workspace = true, features = ["std", "CIContext", "CIImage", "CIFilter", "CIRAWFilter", "objc2-core-foundation", "objc2-core-graphics"] }
