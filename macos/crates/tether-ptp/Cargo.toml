[package]
name = "tether-ptp"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
tether-types.workspace = true
tokio.workspace = true
async-trait.workspace = true
thiserror.workspace = true
chrono.workspace = true
uuid.workspace = true
serde.workspace = true
socket2.workspace = true
tracing.workspace = true
serde_json.workspace = true
futures.workspace = true
reqwest.workspace = true
tokio-tungstenite.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
block2.workspace = true
dispatch2.workspace = true
objc2-foundation = { workspace = true, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSObject", "NSString", "NSThread"] }
objc2-image-capture-core = { workspace = true, features = ["std", "block2", "ICDevice", "ICCameraDevice", "ICCameraItem", "ICDeviceBrowser", "objc2-core-graphics"] }
objc2-core-graphics = { workspace = true, features = ["std", "CGImage", "objc2"] }

[dev-dependencies]
