name: Tether
options:
  bundleIdPrefix: com.bradyjordan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "15.3"

packages:
  TetherCore:
    path: Packages/TetherCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ""

targets:
  Tether:
    type: application
    platform: iOS
    sources:
      - path: Tether
        excludes:
          - "README-Xcode.md"
    dependencies:
      - package: TetherCore
        product: TetherCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bradyjordan.tether
        PRODUCT_NAME: Tether
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: Tether/Tether.entitlements
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    info:
      path: Tether/Info.plist
      properties:
        CFBundleDisplayName: Open Tether
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: "Open Tether uses this to control your connected camera for tethering."
        NSLocalNetworkUsageDescription: "Open Tether looks for cameras on the Wi-Fi network you are connected to and receives photos they send. It never joins a network for you."
        NSBonjourServices:
          - _ptp._tcp
          - _lnp._tcp
          - _bonjour._tcp
        NSPhotoLibraryAddUsageDescription: "Open Tether saves the photos you choose to export into an album named after your session."
        NSPhotoLibraryUsageDescription: "Open Tether saves exported photos into your library and checks that the save completed."
        NSLocationWhenInUseUsageDescription: "Open Tether reads the Wi-Fi network name so it can tell whether you are connected to your camera's network. Your location is never stored or sent anywhere."
        UIBackgroundModes:
          - fetch
          - processing
        UISupportsDocumentBrowser: true
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        UIRequiresFullScreen: false
        ITSAppUsesNonExemptEncryption: false

  TetherTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TetherTests
    dependencies:
      - target: Tether
      - package: TetherCore
        product: TetherCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bradyjordan.tether.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tether.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Tether"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Tether:
    build:
      targets:
        Tether: all
        TetherTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TetherTests
    archive:
      config: Release
